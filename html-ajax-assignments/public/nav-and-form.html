<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar & Feedback Form</title>
  <style>
    /* -----------------------------------------
       6b) CSS for Horizontal Navigation Bar
       ----------------------------------------- */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }

    /* The Navigation Bar Container */
    .navbar {
      background-color: #333; /* Dark background */
      overflow: hidden;       /* Clear floats */
    }

    /* Horizontal Links inside the navbar */
    .navbar a {
      float: left;             /* Align links horizontally */
      display: block;
      color: white;            /* White text color */
      text-align: center;
      padding: 14px 20px;      /* Spacing around text */
      text-decoration: none;   /* Remove underline */
      font-size: 17px;
      transition: background-color 0.3s ease, color 0.3s ease; /* Smooth hover transition */
    }

    /* Change color on hover */
    .navbar a:hover {
      background-color: #ddd;  /* Light grey background on hover */
      color: black;            /* Black text on hover */
    }

    /* Active link style */
    .navbar a.active {
      background-color: #04AA6D; /* Green accent for active page */
      color: white;
    }

    /* -----------------------------------------
       6a) CSS for Feedback Form
       ----------------------------------------- */
    .form-container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .form-container h2 {
      margin-top: 0;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    .submit-btn {
      width: 100%;
      background-color: #04AA6D;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .submit-btn:hover {
      background-color: #038c5a;
    }
  </style>
</head>
<body>

  <!-- 6b) Navigation Bar -->
  <div class="navbar">
    <a class="active" href="#">Home</a>
    <a href="#">About Us</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>

  <!-- 6a) Feedback Form -->
  <div class="form-container">
    <h2>We Value Your Feedback</h2>
    <form action="#" method="POST">
      
      <!-- Name Field -->
      <div class="form-group">
        <label for="userName">Name:</label>
        <input type="text" id="userName" name="userName" placeholder="Enter your full name" required>
      </div>
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="userEmail">Email:</label>
        <input type="email" id="userEmail" name="userEmail" placeholder="Enter your email address" required>
      </div>
      
      <!-- Comments Field -->
      <div class="form-group">
        <label for="userComments">Comments:</label>
        <textarea id="userComments" name="userComments" rows="5" placeholder="Write your feedback here..." required></textarea>
      </div>
      
      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Submit Feedback</button>

    </form>
  </div>

</body>
</html>
