<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX Online Feedback System</title>
</head>

<body>

  <h1>Student Feedback System</h1>
  <p>Submit your feedback below. It will be sent via AJAX and appear instantly below without a page reload.</p>

  <form id="feedbackForm">
    <div id="statusMessage">Feedback submitted successfully!</div>
    <div class="form-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label for="message">Feedback Message</label>
      <textarea id="message" rows="4" required></textarea>
    </div>
    <button type="submit">Submit Feedback</button>
  </form>

  <div id="feedbackList">
    <h3>Recent Feedback:</h3>
    <!-- Feedback items will be appended here dynamically -->
  </div>

  <script>
    const form = document.getElementById('feedbackForm');
    const feedbackList = document.getElementById('feedbackList');
    const statusMessage = document.getElementById('statusMessage');

    // Handle form submission via simple AJAX
    form.addEventListener('submit', function (e) {
      e.preventDefault(); // Prevent page reload

      // Get values from form
      const feedbackData = {
        name: document.getElementById('name').value,
        message: document.getElementById('message').value
      };

      // Simple AJAX POST request
      fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(feedbackData)
      })
        .then(response => response.json())
        .then(newFeedback => {
          // Display the new feedback instantly
          const div = document.createElement('div');
          div.innerHTML = `<h4>${newFeedback.name}</h4><p>${newFeedback.message}</p><hr>`;
          feedbackList.appendChild(div);

          // Show success message and clear form
          statusMessage.style.display = 'block';
          setTimeout(() => { statusMessage.style.display = 'none'; }, 3000);
          form.reset();
        });
    });
  </script>
</body>

</html>
