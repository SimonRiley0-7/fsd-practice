<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Hamburger Menu</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
    }

    /* Navbar Container */
    .navbar {
      background-color: #2c3e50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 60px;
    }

    .brand {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    /* Navigation Links */
    .nav-links {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links li {
      margin-left: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #3498db;
    }

    /* Hamburger Icon (Hidden on Desktop) */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .hamburger span {
      height: 3px;
      width: 25px;
      background-color: white;
      margin-bottom: 4px;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* -------------------------------------
       Media Queries for Mobile Devices
       ------------------------------------- */
    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .nav-links {
        display: none; /* Hidden by default on mobile */
        flex-direction: column;
        width: 100%;
        background-color: #34495e;
        position: absolute;
        top: 60px;
        left: 0;
        padding: 10px 0;
      }

      /* When the "active" class is added via JS, show the menu */
      .nav-links.active {
        display: flex;
      }

      .nav-links li {
        margin: 0;
        text-align: center;
        padding: 15px 0;
        border-bottom: 1px solid #455a6f;
      }

      .nav-links li:last-child {
        border-bottom: none;
      }
    }
    
    .content {
      padding: 40px 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="brand">MyLogo</a>
    
    <!-- Hamburger Icon -->
    <div class="hamburger" id="hamburger-menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Navigation Links -->
    <ul class="nav-links" id="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="content">
    <h1>Responsive Navigation Menu</h1>
    <p>Resize the browser window to see the links collapse into a mobile-friendly hamburger menu!</p>
  </div>

  <script>
    // JavaScript to toggle the mobile menu
    const hamburger = document.getElementById('hamburger-menu');
    const navLinks = document.getElementById('nav-links');

    hamburger.addEventListener('click', () => {
      // Toggle the 'active' class to show/hide the menu
      navLinks.classList.toggle('active');
    });
  </script>

</body>
</html>
