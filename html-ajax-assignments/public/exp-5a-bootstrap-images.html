<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Images Side by Side</title>

    <!-- Image 2 -->
    <div class="col-md-4 mb-3">

    </div>
    
    <!-- Image 3 -->
    <div class="col-md-4 mb-3">
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&q=80" class="img-fluid rounded shadow" alt="Landscape 3">
    </div>
  </div>

</div>

<!-- Bootstrap JS (Optional but good practice) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
